server:
  port: 8702

spring:
  application:
    name: roc-pdf
  data:
    redis:
      password: ${REDIS_PASSWORD:123456}
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes:
          - ${REDIS_SENTINEL_NODE_1:localhost:26379}
          - ${REDIS_SENTINEL_NODE_2:localhost:26380}
          - ${REDIS_SENTINEL_NODE_3:localhost:26381}
        password: ${REDIS_SENTINEL_PASSWORD:}   # Sentinel 本身的认证密码，若无可留空
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

pdf:
  template:
    # 外部挂载目录，替换模板无需重启；本地开发可指向 classpath 外路径
    path: ${PDF_TEMPLATE_PATH:./pdf-templates}
  async:
    core-pool-size: 8
    max-pool-size: 16
    queue-capacity: 10000
    thread-name-prefix: pdf-gen-
    upload-pool-size: 8
  task:
    ttl-days: 7
  timing:
    enabled: ${PDF_TIMING_ENABLED:true}
    max-entries: ${PDF_TIMING_MAX_ENTRIES:10000}
  qps:
    ttl-seconds: ${PDF_QPS_TTL_SECONDS:600}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:qakrOACHdp3DiMuEaxzM}
  secret-key: ${MINIO_SECRET_KEY:Huxg6qfitMDJnxSUL3N2PF99OEoZHjwV9mWtow1I}
  bucket: ${MINIO_BUCKET:roc-pdf}

logging:
  file:
    path: ${LOG_PATH:./logs}
